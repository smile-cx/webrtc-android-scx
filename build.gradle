// Top-level build file for JitPack
buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
    }
    // AGP 8.1.0 pulls in ASM 9.2, which the shadow plugin loads from this
    // parent classpath and which rejects newer bytecode (e.g. major version 65
    // for Java 21, 69 for Java 25) in freshly built WebRTC milestones. Force a
    // newer ASM that supports it.
    configurations.classpath {
        resolutionStrategy {
            force 'org.ow2.asm:asm:9.10.1'
            force 'org.ow2.asm:asm-commons:9.10.1'
            force 'org.ow2.asm:asm-tree:9.10.1'
            force 'org.ow2.asm:asm-analysis:9.10.1'
            force 'org.ow2.asm:asm-util:9.10.1'
        }
    }
}

group = 'cx.smile'
version = findProperty('VERSION_NAME') ?: '1.0.0'
